<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080611">
<title>Vzkazy pro Tebe | ORINAYA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Italianno&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080611;color:#fff;font-family:"Montserrat",Arial,sans-serif}
body{overflow-x:hidden}
.poster-shell{width:100%;display:flex;justify-content:center;background:#080611}
.poster{
  position:relative;
  width:min(100vw,1024px);
  aspect-ratio:2/3;
  background:url("/vzkazy-poster.png") top center/100% 100% no-repeat;
  overflow:hidden;
}
.hotspot,.overlay-input,.overlay-textarea{
  position:absolute;
  z-index:5;
}
.hotspot{
  border:0;
  background:transparent;
  cursor:pointer;
  color:transparent;
}
.hotspot:focus-visible{outline:2px solid rgba(241,215,155,.8);outline-offset:2px;border-radius:999px}

#heroRandomBtn{left:8.2%;top:32.5%;width:24.2%;height:4.6%}
#saveBtn{left:31.2%;top:75.9%;width:17.5%;height:3.6%}
#shareBtn{left:51.2%;top:75.9%;width:17.5%;height:3.6%}
#submitBtnOverlay{left:58.5%;top:89.0%;width:19.0%;height:3.5%}

.random-overlay{
  position:absolute;
  z-index:4;
  left:24.0%;
  top:58.9%;
  width:52.2%;
  min-height:18.0%;
  padding:6.7% 5% 4.6%;
  text-align:center;
  color:#f5edf3;
  display:flex;
  flex-direction:column;
  justify-content:center;
  pointer-events:none;
}
.random-overlay .msg{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(18px,2.6vw,34px);
  line-height:1.25;
  text-shadow:0 2px 12px rgba(0,0,0,.35);
}
.random-overlay .author{
  margin-top:2.3%;
  font-family:"Italianno",cursive;
  color:#d7aa57;
  font-size:clamp(18px,2.2vw,28px);
}

.overlay-textarea{
  left:22.6%;top:84.0%;
  width:54.5%;height:4.8%;
  resize:none;
  border:1px solid rgba(224,183,99,.20);
  border-radius:10px;
  background:rgba(10,7,18,.18);
  color:#f8f1f7;
  padding:1.2% 1.5%;
  font-size:clamp(9px,1.1vw,14px);
  outline:none;
  backdrop-filter:blur(2px);
}
.overlay-input{
  left:22.6%;top:89.3%;
  width:35.0%;height:2.5%;
  border:1px solid rgba(224,183,99,.20);
  border-radius:8px;
  background:rgba(10,7,18,.18);
  color:#f8f1f7;
  padding:0 1.2%;
  font-size:clamp(8px,1vw,13px);
  outline:none;
}
.anonymous-wrap{
  position:absolute;z-index:6;
  left:60.5%;top:89.4%;
  width:16%;height:2.4%;
  display:flex;align-items:center;gap:6px;
  color:transparent; /* baked label is already in the image */
}
.anonymous-wrap input{accent-color:#d7aa57}

.status{
  position:absolute;z-index:8;
  left:22%;top:92.6%;width:56%;
  text-align:center;
  color:#f1d79b;
  font-size:clamp(8px,1vw,12px);
  pointer-events:none;
}
.music-toggle{
  position:fixed;right:14px;bottom:14px;z-index:50;
  border:1px solid rgba(215,170,87,.34);border-radius:999px;
  background:rgba(8,6,17,.84);color:#ead9b8;
  padding:9px 12px;font-size:8px;letter-spacing:.12em;text-transform:uppercase;
}

@media(max-width:700px){
  .poster{width:100vw}
  .random-overlay .msg{font-size:clamp(14px,4.1vw,24px)}
  .random-overlay .author{font-size:clamp(14px,3.8vw,23px)}
}
</style>
</head>
<body>

<audio id="orinaya-music" src="./orinaya-piano.mp3" preload="metadata" loop></audio>
<button class="music-toggle" id="music-toggle" type="button" aria-label="Pustit atmosféru" aria-pressed="false">
  <span class="music-label">Pustit atmosféru</span>
</button>

<div class="poster-shell">
  <main class="poster" id="poster">
    <button class="hotspot" id="heroRandomBtn" type="button" aria-label="Vytáhni si vzkaz">Vytáhni si vzkaz</button>

    <div class="random-overlay" id="randomOverlay">
      <div class="msg" id="randomOverlayText">Klikni na „Vytáhni si vzkaz“.</div>
      <div class="author" id="randomOverlayAuthor"></div>
    </div>

    <button class="hotspot" id="saveBtn" type="button" aria-label="Uložit vzkaz">Uložit</button>
    <button class="hotspot" id="shareBtn" type="button" aria-label="Sdílet vzkaz">Sdílet</button>

    <textarea class="overlay-textarea" id="message" maxlength="500" placeholder="Napiš svůj vzkaz..."></textarea>
    <input class="overlay-input" id="name" type="text" maxlength="80" placeholder="Jméno nebo podpis (volitelné)">
    <label class="anonymous-wrap"><input type="checkbox" id="anonymous"><span>Anonymně</span></label>
    <button class="hotspot" id="submitBtnOverlay" type="button" aria-label="Poslat vzkaz">Poslat vzkaz</button>

    <div id="status" class="status"></div>
  </main>
</div>

<script>
let loadedMessages = [];
let currentRandomMessage = null;

async function fetchAllApprovedMessages(){
  const all = [];
  let offset = 0;
  for(let loops=0; loops<20; loops++) {
    const r = await fetch(`/api/messages?limit=100&offset=${offset}`);
    if(!r.ok) throw new Error("Vzkazy se teď nepodařilo načíst.");
    const data = await r.json();
    const batch = data.messages || [];
    all.push(...batch);
    if(!data.hasMore || !batch.length) break;
    offset = data.nextOffset ?? (offset + batch.length);
  }
  return all;
}

async function pickRandom(){
  const st = document.getElementById("status");
  st.textContent = "Hledám jeden vzkaz pro tebe…";
  try{
    const pool = await fetchAllApprovedMessages();
    if(!pool.length){
      st.textContent = "Zatím tu není žádný schválený vzkaz.";
      return;
    }
    let picked = pool[Math.floor(Math.random()*pool.length)];
    if(pool.length > 1 && currentRandomMessage){
      let guard=0;
      while(picked === currentRandomMessage && guard < 8){
        picked = pool[Math.floor(Math.random()*pool.length)];
        guard++;
      }
    }
    currentRandomMessage = picked;
    document.getElementById("randomOverlayText").textContent = picked.message;
    document.getElementById("randomOverlayAuthor").textContent =
      picked.anonymous ? "Anonymně" : (picked.name || "Anonymně");
    st.textContent = "";
  }catch(err){
    st.textContent = err.message || "Náhodný vzkaz se teď nepodařilo načíst.";
  }
}

document.getElementById("heroRandomBtn").addEventListener("click", pickRandom);

document.getElementById("submitBtnOverlay").addEventListener("click", async () => {
  const st = document.getElementById("status");
  const message = document.getElementById("message").value.trim();
  if(!message){
    st.textContent = "Napiš nejdřív svůj vzkaz.";
    return;
  }
  st.textContent = "Odesílám…";
  try{
    const r = await fetch("/api/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message,
        name:document.getElementById("name").value.trim(),
        anonymous:document.getElementById("anonymous").checked
      })
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error || "Nepodařilo se odeslat vzkaz.");
    document.getElementById("message").value = "";
    document.getElementById("name").value = "";
    document.getElementById("anonymous").checked = false;
    st.textContent = "Děkuju. Tvůj vzkaz teď čeká na schválení. ♡";
  }catch(err){
    st.textContent = err.message || "Nepodařilo se odeslat vzkaz.";
  }
});

function splitCanvasText(ctx,text,maxWidth){
  const words = String(text || "").trim().split(/\s+/);
  const lines=[]; let line="";
  for(const word of words){
    const test=line?`${line} ${word}`:word;
    if(ctx.measureText(test).width<=maxWidth) line=test;
    else{ if(line) lines.push(line); line=word; }
  }
  if(line) lines.push(line);
  return lines;
}

async function createMessageImage(message){
  const canvas=document.createElement("canvas");
  canvas.width=1080; canvas.height=1350;
  const ctx=canvas.getContext("2d");
  const bg=ctx.createLinearGradient(0,0,1080,1350);
  bg.addColorStop(0,"#080611"); bg.addColorStop(1,"#0b0715");
  ctx.fillStyle=bg; ctx.fillRect(0,0,1080,1350);
  ctx.textAlign="center";
  ctx.fillStyle="#e7d3aa";
  ctx.font='400 62px "Cormorant Garamond", Georgia, serif';
  ctx.fillText("ORINAYA",540,160);
  ctx.fillStyle="#d7aa57";
  ctx.font='500 18px "Montserrat", Arial, sans-serif';
  ctx.fillText("VZKAZ PRO TEBE",540,215);
  ctx.strokeStyle="rgba(215,170,87,.34)"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.roundRect(115,300,850,760,34); ctx.stroke();
  ctx.fillStyle="#f7eff5";
  ctx.font='400 46px "Cormorant Garamond", Georgia, serif';
  const lines=splitCanvasText(ctx,message.message,660);
  let y=600-(lines.length*58)/2;
  for(const line of lines){ctx.fillText(line,540,y);y+=58;}
  ctx.fillStyle="#d7aa57";
  ctx.font='400 40px "Italianno", cursive';
  ctx.fillText(message.anonymous?"Anonymně":(message.name||"Anonymně"),540,880);
  ctx.fillStyle="#96899e";
  ctx.font='300 16px "Montserrat", Arial, sans-serif';
  ctx.fillText("orinaya.blog",540,1015);
  return await new Promise(resolve=>canvas.toBlob(resolve,"image/png",1));
}

async function saveCurrent(){
  if(!currentRandomMessage) return;
  const blob=await createMessageImage(currentRandomMessage);
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="orinaya-vzkaz-pro-tebe.png";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

async function shareCurrent(){
  if(!currentRandomMessage) return;
  const blob=await createMessageImage(currentRandomMessage);
  const file=new File([blob],"orinaya-vzkaz-pro-tebe.png",{type:"image/png"});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({title:"Vzkaz pro Tebe | ORINAYA",files:[file]});
  } else if(navigator.share){
    await navigator.share({title:"Vzkaz pro Tebe | ORINAYA",text:currentRandomMessage.message,url:location.href});
  } else {
    saveCurrent();
  }
}

document.getElementById("saveBtn").addEventListener("click", saveCurrent);
document.getElementById("shareBtn").addEventListener("click", shareCurrent);
</script>

<script>

(function(){
  const audio = document.getElementById('orinaya-music');
  const button = document.getElementById('music-toggle');
  if (!audio || !button) return;

  const label = button.querySelector('.music-label');
  const KEY = 'orinayaMusicStateV1';
  audio.volume = 0.18;

  function readState(){
    try{
      return JSON.parse(localStorage.getItem(KEY) || '{}');
    }catch(e){
      return {};
    }
  }

  function saveState(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        playing: !audio.paused,
        time: Number.isFinite(audio.currentTime) ? audio.currentTime : 0,
        updated: Date.now()
      }));
    }catch(e){}
  }

  function setButton(playing, wantsResume){
    button.classList.toggle('is-playing', playing);
    button.setAttribute('aria-pressed', playing ? 'true' : 'false');

    if (playing){
      button.setAttribute('aria-label','Ztišit atmosféru');
      if (label) label.textContent = 'Ztišit atmosféru';
    }else if (wantsResume){
      button.setAttribute('aria-label','Pokračovat v atmosféře');
      if (label) label.textContent = 'Pokračovat v atmosféře';
    }else{
      button.setAttribute('aria-label','Pustit atmosféru');
      if (label) label.textContent = 'Pustit atmosféru';
    }
  }

  const state = readState();
  let wantsResume = !!state.playing;

  audio.addEventListener('loadedmetadata', async function(){
    if (Number.isFinite(state.time) && state.time > 0 && audio.duration){
      audio.currentTime = state.time % audio.duration;
    }

    if (wantsResume){
      try{
        await audio.play();
        setButton(true, false);
      }catch(e){
        setButton(false, true);
      }
    }else{
      setButton(false, false);
    }
  }, {once:true});

  button.addEventListener('click', async function(){
    if (audio.paused){
      try{
        await audio.play();
        wantsResume = true;
        setButton(true, false);
        saveState();
      }catch(e){
        setButton(false, true);
      }
    }else{
      audio.pause();
      wantsResume = false;
      setButton(false, false);
      saveState();
    }
  });

  audio.addEventListener('play', function(){
    wantsResume = true;
    setButton(true, false);
    saveState();
  });

  audio.addEventListener('pause', function(){
    setButton(false, wantsResume);
    saveState();
  });

  let lastSave = 0;
  audio.addEventListener('timeupdate', function(){
    const now = Date.now();
    if (now - lastSave > 1000){
      lastSave = now;
      saveState();
    }
  });

  document.addEventListener('click', function(e){
    const a = e.target.closest('a[href]');
    if (a) saveState();
  }, true);

  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);
})();

</script>

</body>
</html>
