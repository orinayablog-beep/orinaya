<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080611">
<title>Blog | ORINAYA</title>
<meta name="description" content="Osobní texty, příběhy a inspirace na cestě zpět k sobě.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&family=Italianno&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080611;
  --gold:#d7aa57;
  --gold2:#f1d79b;
  --text:#f3ebf2;
  --muted:#d8ced7;
  --muted2:#a99dad;
  --line:rgba(224,183,99,.16);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  margin:0;
  color:var(--text);
  font-family:"Montserrat",Arial,sans-serif;
  font-weight:300;
  background:
    radial-gradient(circle at 50% 5%,rgba(96,43,127,.18),transparent 34rem),
    radial-gradient(circle at 12% 45%,rgba(57,31,99,.10),transparent 38rem),
    linear-gradient(180deg,#080611 0%,#0b0715 48%,#090711 100%);
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* ===== MENU ===== */
header{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:20px clamp(20px,5vw,72px);
  background:rgba(8,6,17,.82);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(224,183,99,.08);
}
.brand{
  font-family:"Cormorant Garamond",Georgia,serif;
  letter-spacing:.18em;
  font-size:24px;
  color:#e8d5ad;
}
nav{
  display:flex;
  gap:26px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:flex-end;
}
nav a{
  position:relative;
  color:#c9bdc9;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  padding-bottom:6px;
}
nav a:after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1px;
  background:var(--gold);
  transition:width .25s ease;
}
nav a:hover:after,
nav a.active:after{width:100%}
nav a.active{color:#ead9b8}

@media(max-width:760px){
  header{padding:18px;gap:15px}
  .brand{font-size:21px}
  nav{gap:13px}
  nav a{font-size:8px}
}

@media (hover:none){
  nav a:hover:after{width:0!important}
  nav a.active:after{width:100%!important}
}

/* ===== DESKTOP HERO ===== */
.hero-visual{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#080611;
  border-bottom:0!important;
}
.hero-visual img{
  display:block;
  width:100%;
  height:auto;
}

.mobile-portrait-hero{display:none}

/* ===== DESKTOP KOLIBŘÍK · HVĚZDNÝ PRACH ===== */
.wing-dust{display:none}

@keyframes wingDustFloat{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  18%{opacity:.72;transform:translate(calc(-50% - 4px),calc(-50% - 3px)) scale(1)}
  55%{opacity:.46;transform:translate(calc(-50% - 11px),calc(-50% - 9px)) scale(1.12)}
  100%{opacity:0;transform:translate(calc(-50% - 22px),calc(-50% - 16px)) scale(.78)}
}
@keyframes wingDustDriftAlt{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  22%{opacity:.64;transform:translate(calc(-50% - 3px),calc(-50% + 2px)) scale(1)}
  58%{opacity:.38;transform:translate(calc(-50% - 10px),calc(-50% + 8px)) scale(1.08)}
  100%{opacity:0;transform:translate(calc(-50% - 19px),calc(-50% + 15px)) scale(.74)}
}

@keyframes hummingbirdGlowDesktop{
  0%,100%{
    opacity:.06;
    transform:translate3d(0,0,0) scale(.92);
    filter:blur(13px);
  }
  50%{
    opacity:.13;
    transform:translate3d(-5px,-4px,0) scale(1.12);
    filter:blur(17px);
  }
}
@keyframes hummingbirdSparkDesktop{
  0%,100%{opacity:.06;transform:translate3d(0,0,0) scale(.9)}
  50%{opacity:.14;transform:translate3d(-8px,-5px,0) scale(1.08)}
}

@media(min-width:601px){
  .hero-visual:before{
    content:"";
    position:absolute;
    z-index:3;
    width:7%;
    aspect-ratio:1;
    right:32.2%;
    top:38.2%;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle,rgba(255,250,226,.78) 0%,rgba(248,218,151,.30) 26%,rgba(215,170,87,.10) 48%,transparent 72%);
    filter:blur(6px);
    animation:hummingbirdSparkDesktop 4.6s ease-in-out infinite;
  }

  .hero-visual:after{
    content:"";
    position:absolute;
    z-index:2;
    width:20%;
    aspect-ratio:1;
    right:18%;
    top:27%;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle,rgba(255,240,198,.42) 0%,rgba(238,194,105,.18) 28%,rgba(215,170,87,.07) 48%,transparent 72%);
    filter:blur(14px);
    animation:hummingbirdGlowDesktop 5.8s ease-in-out infinite;
  }

  .wing-dust{
    display:block;
    position:absolute;
    z-index:7;
    pointer-events:none;
    border-radius:999px;
    background:radial-gradient(circle,rgba(255,250,233,.98) 0%,rgba(249,226,170,.95) 22%,rgba(236,191,104,.58) 54%,rgba(214,153,69,.10) 72%,transparent 76%);
    box-shadow:0 0 10px rgba(255,246,218,.78),0 0 22px rgba(240,198,108,.34);
    mix-blend-mode:screen;
  }

  .dust-1{left:38.2%;top:28.8%;width:8px;height:8px;animation:wingDustFloat 5.4s ease-in-out infinite}
  .dust-2{left:34.5%;top:32.2%;width:6px;height:6px;animation:wingDustFloat 6.2s ease-in-out infinite 1.1s}
  .dust-3{left:30.4%;top:35.6%;width:9px;height:9px;animation:wingDustDriftAlt 5.7s ease-in-out infinite .6s}
  .dust-4{left:26.6%;top:40.5%;width:7px;height:7px;animation:wingDustFloat 6.5s ease-in-out infinite 1.8s}
  .dust-5{left:31.6%;top:45.8%;width:10px;height:10px;animation:wingDustDriftAlt 5.9s ease-in-out infinite 1.4s}
  .dust-6{left:40.9%;top:35.2%;width:5px;height:5px;animation:wingDustFloat 4.9s ease-in-out infinite 2s}
  .dust-7{left:44.6%;top:30.7%;width:6px;height:6px;animation:wingDustDriftAlt 5.1s ease-in-out infinite 2.6s}
  .dust-8{left:36.9%;top:39.7%;width:4px;height:4px;animation:wingDustFloat 4.6s ease-in-out infinite 3s}
}

/* ===== MOBILNÍ HERO ===== */
@keyframes hummingbirdFloatMobile{
  0%,100%{background-position:58% 50%}
  50%{background-position:60% 48.8%}
}
@keyframes hummingbirdGlow{
  0%,100%{opacity:.16;transform:translate3d(0,0,0) scale(.92)}
  50%{opacity:.34;transform:translate3d(2px,-3px,0) scale(1.08)}
}
@keyframes mobileStarPulse{
  0%,100%{transform:scale(.96) rotate(0deg);filter:drop-shadow(0 0 3px rgba(246,223,159,.38));opacity:.92}
  50%{transform:scale(1.08) rotate(3deg);filter:drop-shadow(0 0 8px rgba(246,223,159,.78));opacity:1}
}
@keyframes mobileSparkleTwinkle{
  0%,100%{opacity:.12;transform:scale(.72)}
  45%{opacity:.95;transform:scale(1.18)}
  60%{opacity:.42;transform:scale(.92)}
}
@keyframes mobileSparkleTwinkleSoft{
  0%,100%{opacity:.08;transform:scale(.65)}
  50%{opacity:.72;transform:scale(1.05)}
}

.mobile-sparkles{display:none}

@media (max-width:600px) and (orientation:portrait){
  .hero-visual{display:none!important}

  .mobile-portrait-hero{
    display:block;
    position:relative;
    overflow:hidden;
    border:0!important;
    margin-bottom:-2px;
    background:
      linear-gradient(90deg,rgba(8,6,17,.97) 0%,rgba(8,6,17,.90) 55%,rgba(8,6,17,.26) 100%),
      url("kolibrik-mobile-clean.png") 58% center/cover no-repeat;
    animation:hummingbirdFloatMobile 7.5s ease-in-out infinite;
    will-change:background-position;
    box-shadow:inset 0 -10px 0 #080611;
  }

  .mobile-portrait-hero:after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    background:
      radial-gradient(circle at 76% 48%,rgba(225,171,87,.10),transparent 25%),
      linear-gradient(180deg,rgba(8,6,17,.04) 0%,rgba(8,6,17,.16) 94%,#080611 98%,#080611 100%);
  }

  .mobile-portrait-hero:before{
    content:"";
    position:absolute;
    z-index:1;
    width:280px;
    height:180px;
    right:2%;
    top:32%;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle,rgba(255,224,154,.28) 0%,rgba(215,170,87,.13) 34%,transparent 70%);
    filter:blur(10px);
    animation:hummingbirdGlow 5.8s ease-in-out infinite;
    will-change:transform,opacity;
  }

  .mobile-sparkles{
    display:block;
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }

  .mobile-sparkle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:radial-gradient(circle,#fff9df 0%,#f3d997 34%,rgba(215,170,87,.72) 55%,transparent 72%);
    box-shadow:0 0 6px rgba(255,247,220,.92),0 0 14px rgba(237,195,109,.45);
    mix-blend-mode:screen;
    animation:mobileSparkleTwinkle 3.8s ease-in-out infinite;
  }

  .mobile-sparkle.soft{width:4px;height:4px;animation-name:mobileSparkleTwinkleSoft}
  .ms1{left:44%;top:30%;animation-delay:.2s;animation-duration:3.9s}
  .ms2{left:49%;top:35%;animation-delay:1.1s;animation-duration:4.4s}
  .ms3{left:46%;top:42%;animation-delay:2.2s;animation-duration:3.6s}
  .ms4{left:53%;top:47%;animation-delay:.7s;animation-duration:4.8s}
  .ms5{left:41%;top:51%;animation-delay:1.8s;animation-duration:4.1s}
  .ms6{left:57%;top:56%;animation-delay:2.8s;animation-duration:3.7s}
  .ms7{left:48%;top:60%;animation-delay:1.4s;animation-duration:4.6s}
  .ms8{left:60%;top:38%;animation-delay:3.1s;animation-duration:4.3s}
  .ms9{left:37%;top:38%;animation-delay:2.4s;animation-duration:5s}
  .ms10{left:63%;top:50%;animation-delay:.9s;animation-duration:4.2s}
  .ms11{left:55%;top:27%;animation-delay:1.9s;animation-duration:5.2s}
  .ms12{left:34%;top:46%;animation-delay:3.4s;animation-duration:4.7s}

  .mph-copy{position:relative;z-index:2;padding:64px 24px 42px}
  .mph-kicker{margin:0 0 17px;color:var(--gold);font-size:9px;font-weight:500;letter-spacing:.27em;text-transform:uppercase}
  .mph-title{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:72px;line-height:.88;font-weight:400;letter-spacing:-.02em;color:#ead9b6;text-transform:uppercase}
  .mph-script{margin:24px 0 0;max-width:88%;font-family:"Italianno",cursive;font-size:35px;line-height:1.08;color:#f0e8e2;text-shadow:0 2px 12px rgba(0,0,0,.60)}
  .mph-script span{display:block}
  .mph-script .gold{color:#d9af68}
  .mph-divider{display:flex;align-items:center;gap:12px;width:78%;margin:24px 0 0}
  .mph-divider:before,.mph-divider:after{content:"";height:1px;flex:1;background:rgba(215,170,87,.72)}
  .mph-star{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;overflow:visible;flex:0 0 26px;animation:mobileStarPulse 4.6s ease-in-out infinite;transform-origin:center}
  .mph-star svg{display:block;width:24px;height:24px;overflow:visible}
  .mph-bridge{margin-top:13px;max-width:84%;font-family:"Italianno",cursive;font-size:39px;line-height:1.02;color:#d9af68;text-shadow:0 2px 12px rgba(0,0,0,.50)}
}

/* ===== ČLÁNKY ===== */
.posts-wrap{
  width:min(1080px,90vw);
  margin:0 auto;
  padding:95px 0 110px;
}
.posts-head{
  display:flex;
  justify-content:space-between;
  gap:28px;
  align-items:end;
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
}
.posts-head h2{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(40px,5vw,62px);
  font-weight:400;
  color:#ead8b3;
  margin:0;
}
.posts-head p{
  margin:0;
  color:#9f91a2;
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
}
.posts{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:56px;
}
.post{
  padding:44px 0 48px;
  border-bottom:1px solid var(--line);
}
.post-meta{
  color:var(--gold);
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
  margin-bottom:15px;
}
.post h2{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(30px,3.3vw,43px);
  font-weight:400;
  line-height:1.06;
  color:#eadde5;
  margin:0;
}
.post .quote{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:19px;
  font-style:italic;
  line-height:1.5;
  color:#cbbfca;
  margin:19px 0 0;
  max-width:510px;
}
.read{
  position:relative;
  display:inline-block;
  margin-top:23px;
  padding-bottom:7px;
  color:#ead9b8;
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
}
.read:after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:1px;
  background:linear-gradient(90deg,var(--gold),rgba(215,170,87,.35));
}

/* ===== SDÍLENÍ ČLÁNKŮ ===== */
.post-share{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  margin-top:20px;
}
.share-btn{
  appearance:none;
  -webkit-appearance:none;
  border:1px solid rgba(215,170,87,.34);
  border-radius:999px;
  padding:10px 16px;
  background:rgba(215,170,87,.04);
  color:#ead9b8;
  font-family:"Montserrat",Arial,sans-serif;
  font-size:8px;
  font-weight:400;
  letter-spacing:.14em;
  text-transform:uppercase;
  cursor:pointer;
  transition:border-color .22s ease,background .22s ease,color .22s ease,transform .22s ease;
}
.share-btn:hover{
  border-color:rgba(215,170,87,.64);
  background:rgba(215,170,87,.08);
  color:#f1d79b;
  transform:translateY(-1px);
}
.copy-link-btn{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  padding:0;
  background:none;
  color:#8f8296;
  font-family:"Montserrat",Arial,sans-serif;
  font-size:7.5px;
  font-weight:300;
  letter-spacing:.10em;
  text-transform:uppercase;
  cursor:pointer;
  transition:color .2s ease;
}
.copy-link-btn:hover,
.copy-link-btn.is-copied{
  color:#d7aa57;
}
@media(max-width:760px){
  .posts-wrap{width:90vw;padding:58px 0 80px}
  .posts-head{display:block}
  .posts-head p{margin-top:12px}
  .posts{grid-template-columns:1fr}
  .post{padding:36px 0 40px}
  .post-share{margin-top:18px;gap:7px}
  .share-btn{padding:10px 14px;font-size:7.5px}
  .copy-link-btn{font-size:7px}
}
@media (hover:none){
  .share-btn:hover{
    transform:none;
    background:rgba(215,170,87,.04);
    border-color:rgba(215,170,87,.34);
  }
}

/* ===== ZÁVĚR ===== */
.whisper{
  padding:92px 22px 100px;
  text-align:center;
  border-top:1px solid rgba(224,183,99,.08);
}
.whisper .line{
  width:80px;
  height:1px;
  margin:0 auto 32px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.whisper p{
  margin:0 auto;
  max-width:920px;
  font-family:"Italianno",cursive;
  font-size:clamp(38px,5.3vw,58px);
  line-height:1.14;
  color:#e7d9c5;
  text-shadow:0 0 8px rgba(215,170,87,.08);
}
footer{
  border-top:1px solid var(--line);
  padding:50px 22px 40px;
  text-align:center;
}
.footer-logo{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:34px;
  letter-spacing:.17em;
  color:#e7d3aa;
}
.copy{
  margin-top:25px;
  color:#96899e;
  font-size:9px;
  letter-spacing:.17em;
}

/* ===== JEMNÝ POHYB STRÁNKY ===== */
.reveal-soft{
  opacity:0;
  transform:translate3d(0,16px,0);
  filter:blur(3px);
  transition:
    opacity .72s cubic-bezier(.22,.61,.36,1),
    transform .72s cubic-bezier(.22,.61,.36,1),
    filter .72s ease;
  transition-delay:var(--reveal-delay,0ms);
  will-change:opacity,transform,filter;
}
.reveal-soft.is-visible{
  opacity:1;
  transform:translate3d(0,0,0);
  filter:blur(0);
}

.orinaya-page-fade{
  position:fixed;
  inset:0;
  z-index:99999;
  pointer-events:none;
  opacity:0;
  background:#080611;
  transition:opacity .22s ease;
}
html.is-leaving .orinaya-page-fade{
  opacity:1;
  pointer-events:auto;
}
html.is-entering .orinaya-page-fade{opacity:1}

@media(prefers-reduced-motion:reduce){
  .reveal-soft{
    opacity:1!important;
    transform:none!important;
    filter:none!important;
    transition:none!important;
  }
  .orinaya-page-fade{display:none!important}
  .mobile-portrait-hero,
  .mobile-portrait-hero:before,
  .mph-star,
  .mobile-sparkle,
  .hero-visual:before,
  .hero-visual:after,
  .wing-dust{
    animation:none!important;
  }
  .wing-dust{opacity:.32}
}

/* ===== ORINAYA • HUDBA ===== */
.music-toggle{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:9990;
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 14px;
  border:1px solid rgba(215,170,87,.34);
  border-radius:999px;
  background:rgba(8,6,17,.78);
  color:#ead9b8;
  font:400 9px/1 "Montserrat",Arial,sans-serif;
  letter-spacing:.13em;
  text-transform:uppercase;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 28px rgba(0,0,0,.26);
  cursor:pointer;
  opacity:.80;
  transition:opacity .2s ease,border-color .2s ease,transform .2s ease;
}
.music-toggle:hover{
  opacity:1;
  border-color:rgba(215,170,87,.58);
  transform:translateY(-1px);
}
.music-toggle .music-icon{
  width:18px;
  height:18px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border:1px solid rgba(215,170,87,.32);
  border-radius:50%;
  font-size:10px;
  line-height:1;
  color:#f1d79b;
}
.music-toggle.is-playing .music-icon{
  box-shadow:0 0 12px rgba(215,170,87,.32);
}
@media(max-width:760px){
  .music-toggle{
    right:14px;
    bottom:14px;
    padding:9px 11px;
    gap:7px;
    font-size:8px;
    background:rgba(8,6,17,.84);
  }
}
</style>
</head>

<body>

<audio id="orinaya-music" src="./orinaya-piano.mp3" preload="metadata" loop></audio>
<button class="music-toggle" id="music-toggle" type="button"
        aria-label="Pustit atmosféru" aria-pressed="false">
  <span class="music-icon" aria-hidden="true">♪</span>
  <span class="music-label">Pustit atmosféru</span>
</button>

<header>
  <a class="brand" href="index.html">ORINAYA</a>
  <nav>
    <a href="index.html">Domů</a>
    <a href="omne.html">O mně</a>
    <a href="promena.html">Proměna</a>
    <a class="active" href="blog.html">Blog</a>
  </nav>
</header>

<main>
<section class="hero-visual" aria-label="Blog ORINAYA">
  <span class="wing-dust dust-1" aria-hidden="true"></span>
  <span class="wing-dust dust-2" aria-hidden="true"></span>
  <span class="wing-dust dust-3" aria-hidden="true"></span>
  <span class="wing-dust dust-4" aria-hidden="true"></span>
  <span class="wing-dust dust-5" aria-hidden="true"></span>
  <span class="wing-dust dust-6" aria-hidden="true"></span>
  <span class="wing-dust dust-7" aria-hidden="true"></span>
  <span class="wing-dust dust-8" aria-hidden="true"></span>
  <img src="blog-hero-final.png" alt="ORINAYA Blog. Příběhy, vhledy, inspirace. Někdy stačí pár řádků a všechno se uvnitř změní. Začti se do textů, které nejsou psané hlavou, ale srdcem. Cesta, která nás spojuje.">

<!-- Zachovej zde svůj stávající blok článků beze změny.
     Skript níže automaticky přidá sdílení ke každému .post,
     který obsahuje odkaz .read. -->

</main>

<script>
(function(){
  document.querySelectorAll('.post').forEach(function(post){
    const readLink = post.querySelector('.read');
    const titleEl = post.querySelector('h2');

    if(!readLink || post.querySelector('.post-share')) return;

    const articleUrl = new URL(readLink.getAttribute('href'), window.location.href).href;
    const articleTitle = titleEl ? titleEl.textContent.trim() : 'Článek ORINAYA';

    const shareWrap = document.createElement('div');
    shareWrap.className = 'post-share';

    const shareBtn = document.createElement('button');
    shareBtn.type = 'button';
    shareBtn.className = 'share-btn';
    shareBtn.textContent = 'Sdílet článek';

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'copy-link-btn';
    copyBtn.textContent = 'Zkopírovat odkaz';

    shareBtn.addEventListener('click', async function(){
      if(navigator.share){
        try{
          await navigator.share({
            title: articleTitle,
            text: articleTitle + ' · ORINAYA',
            url: articleUrl
          });
        }catch(error){
          if(error.name !== 'AbortError'){
            console.log('Sdílení nebylo dostupné:', error);
          }
        }
      }else{
        copyBtn.click();
      }
    });

    copyBtn.addEventListener('click', async function(){
      try{
        await navigator.clipboard.writeText(articleUrl);
      }catch(error){
        const tempInput = document.createElement('input');
        tempInput.value = articleUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        tempInput.remove();
      }

      copyBtn.textContent = 'Odkaz zkopírován ✓';
      copyBtn.classList.add('is-copied');

      setTimeout(function(){
        copyBtn.textContent = 'Zkopírovat odkaz';
        copyBtn.classList.remove('is-copied');
      }, 2200);
    });

    shareWrap.appendChild(shareBtn);
    shareWrap.appendChild(copyBtn);
    readLink.insertAdjacentElement('afterend', shareWrap);
  });
})();
</script>
