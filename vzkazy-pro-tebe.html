<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080611">
<title>Vzkazy pro Tebe | ORINAYA</title>
<meta name="description" content="Vzkazy pro Tebe. Slova odvahy, podpory a naděje pro chvíle, kdy je potřebujeme slyšet.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Italianno&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080611;
  --gold:#d7aa57;
  --gold2:#f1d79b;
  --text:#f5edf3;
  --muted:#d7ccd7;
  --line:rgba(224,183,99,.18);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 68% 10%,rgba(113,52,146,.18),transparent 30rem),
    linear-gradient(180deg,#080611 0%,#0b0715 48%,#090711 100%);
  color:var(--text);
  font-family:"Montserrat",Arial,sans-serif;
  font-weight:300;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}

/* TOP: pouze Zpět domů, stejné chování jako u karet */
.topbar{
  width:100%;
  margin:0;
  padding:22px 4vw 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  z-index:10;
}
.top-logo{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(30px,2.6vw,44px);
  line-height:1;
  letter-spacing:.18em;
  color:#ead8b0;
}
.home-link{
  position:relative;
  display:inline-block;
  padding:0 0 6px;
  color:#cfc2cf;
  font-size:10px;
  letter-spacing:.17em;
  text-transform:uppercase;
  transition:color .22s ease,text-shadow .22s ease,transform .22s ease;
}
.home-link::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1px;
  background:var(--gold);
  transition:width .25s ease;
}
.home-link:hover{
  color:#f1d79b;
  text-shadow:0 0 10px rgba(215,170,87,.26);
  transform:translateY(-1px);
}
.home-link:hover::after{width:100%}

/* HERO jako skutečný obrázek 1:1 */
.hero-image-wrap{
  width:min(96vw, calc((100vh - 105px) * 1.744));
  max-width:2048px;
  margin:0 auto 36px;
  position:relative;
  z-index:2;
  overflow:hidden;
}
.hero-image{
  display:block;
  width:100%;
  height:auto;
  border-radius:0;
  filter:none;
}
/* klikací hotspot přes zlaté tlačítko v obrázku */
.hero-hotspot{
  position:absolute;
  left:10.3%;
  top:74.5%;
  width:29.7%;
  height:9.6%;
  border:0;
  border-radius:999px;
  background:transparent;
  cursor:pointer;
}
.hero-hotspot:focus-visible{
  outline:2px solid rgba(241,215,155,.9);
  outline-offset:3px;
}
.hero-hotspot::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:999px;
  box-shadow:0 0 0 rgba(215,170,87,0);
  transition:box-shadow .22s ease,background .22s ease;
}
.hero-hotspot:hover::after{
  box-shadow:0 0 28px rgba(215,170,87,.22);
  background:rgba(255,255,255,.015);
}

/* NÁHODNÝ VZKAZ */
.random-wrap{
  width:min(760px,88vw);
  margin:4px auto 82px;
  text-align:center;
  position:relative;
  z-index:2;
}
.random-btn{
  display:none;
  border:1px solid rgba(215,170,87,.46);
  border-radius:999px;
  padding:14px 24px;
  color:#eed3a0;
  background:rgba(215,170,87,.035);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  cursor:pointer;
}
.random-result{
  max-width:700px;
  margin:25px auto 0;
  opacity:0;
  transform:translateY(15px);
  height:0;
  overflow:hidden;
  transition:.35s ease;
}
.random-result.show{opacity:1;transform:none;height:auto;overflow:visible}
.random-result .message{
  text-align:center;
  padding:44px 54px 36px;
  border-color:rgba(215,170,87,.34);
  box-shadow:0 22px 70px rgba(0,0,0,.25),0 0 40px rgba(106,52,136,.07);
}
.random-result .message-text{font-size:clamp(30px,3vw,44px);line-height:1.3}
.random-result .message-line{margin:18px auto 12px}
.random-result .message-actions{justify-content:center}

/* FORM • ORINAYA glassmorphism */
.form-wrap{
  width:min(720px,88vw);
  margin:0 auto 96px;
  position:relative;
  z-index:2;
}
.form-heading{
  text-align:center;
  margin-bottom:24px;
}
.form-heading h2{
  margin:0;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(42px,4.2vw,58px);
  line-height:1;
  font-weight:400;
  color:#f0e2c8;
}
.form-script{
  margin-top:9px;
  color:#cab8c7;
  font-family:"Montserrat",Arial,sans-serif;
  font-size:clamp(12px,1.1vw,14px);
  line-height:1.55;
  letter-spacing:.02em;
  opacity:.82;
}

.form-card{
  position:relative;
  padding:34px 34px 30px;
  border:1px solid rgba(232,208,141,.18);
  border-radius:18px;
  background:
    linear-gradient(180deg,rgba(29,14,41,.46),rgba(18,9,28,.34));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:
    0 22px 70px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.035),
    0 0 36px rgba(125,57,148,.05);
  overflow:hidden;
}
.form-card::before{
  content:"";
  position:absolute;
  inset:-30% 45% auto -20%;
  height:220px;
  background:radial-gradient(circle,rgba(215,170,87,.09),transparent 68%);
  pointer-events:none;
}
.form-card::after{
  content:"✦";
  position:absolute;
  top:18px;
  right:22px;
  color:#d7aa57;
  opacity:.42;
  font-size:12px;
  text-shadow:0 0 12px rgba(215,170,87,.16);
}
.form-card h2{display:none}

.input-group{
  position:relative;
  margin-bottom:24px;
  text-align:left;
}
label{
  display:block;
  margin:0 0 8px;
  color:#b9adb9;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

textarea,input[type=text]{
  width:100%;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.20);
  border-radius:0;
  background:transparent;
  color:#fff;
  padding:11px 0 12px;
  outline:none;
  transition:border-color .25s ease,box-shadow .25s ease,color .25s ease;
}
textarea{
  min-height:138px;
  resize:vertical;
  line-height:1.75;
  font-family:"Montserrat",Arial,sans-serif;
  font-size:15px;
  font-weight:300;
}
input[type=text]{
  font-size:15px;
  font-weight:300;
}
textarea:focus,input[type=text]:focus{
  border-bottom-color:#e8d08d;
  box-shadow:0 6px 12px -12px rgba(232,208,141,.75);
}
::placeholder{
  color:rgba(255,255,255,.44);
  font-weight:300;
}

.counter{
  margin-top:7px;
  text-align:right;
  color:#807486;
  font-size:9px;
}
.symbol-label{
  margin-top:2px;
  color:#9f92a2;
  font-size:9px;
  letter-spacing:.1em;
}
.symbol-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:11px;
}
.symbol-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid rgba(232,208,141,.18);
  background:rgba(255,255,255,.01);
  color:#dcb96c;
  font-size:18px;
  cursor:pointer;
  transition:.22s ease;
}
.symbol-btn:hover{
  color:#f1d79b;
  border-color:rgba(232,208,141,.48);
  box-shadow:0 0 13px rgba(232,208,141,.08);
  transform:translateY(-1px);
}

.check{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:2px;
  color:#b8adb9;
  font-size:11px;
  letter-spacing:.01em;
}
.check input{accent-color:#d7aa57}

.submit{
  display:block;
  margin:30px auto 0;
  min-width:210px;
  border:1px solid #e8d08d;
  border-radius:999px;
  padding:12px 28px;
  background:transparent;
  color:#e8d08d;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:16px;
  letter-spacing:.14em;
  text-transform:uppercase;
  cursor:pointer;
  transition:.32s ease;
}
.submit:hover{
  background:#e8d08d;
  color:#140a1e;
  box-shadow:0 0 18px rgba(232,208,141,.24);
  transform:translateY(-1px);
}


.thank-you{
  margin-top:18px;
  text-align:center;
  font-family:"Montserrat",Arial,sans-serif;
  font-size:11px;
  line-height:1.4;
  color:rgba(255,255,255,.82);
  letter-spacing:.06em;
  opacity:.92;
}

.note{
  margin-top:17px;
  text-align:center;
  color:#7f7484;
  font-size:9px;
  letter-spacing:.04em;
  line-height:1.6;
}
.status{
  display:none;
  margin-top:12px;
  text-align:center;
  color:#d1c5d0;
  font-size:11px;
  line-height:1.6;
}
.status.show{display:block}
.status.ok{color:#f1d79b}
.status.err{color:#ffb6c1}

/* VZKAZY OD OSTATNÍCH */
.messages{
  width:min(1080px,88vw);
  margin:0 auto;
  padding:0 0 94px;
  position:relative;
  z-index:2;
}
.messages-head{text-align:center;margin-bottom:34px}
.messages-head .script{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:38px;
  color:#e9ddc7;
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.message{
  padding:26px 26px 22px;
  border:1px solid rgba(224,183,99,.2);
  border-radius:24px;
  background:
    radial-gradient(circle at 88% 8%,rgba(122,66,150,.10),transparent 40%),
    linear-gradient(145deg,rgba(255,255,255,.024),rgba(255,255,255,.006));
  box-shadow:0 12px 36px rgba(0,0,0,.18);
  position:relative;
}
.message::before{content:"✦";position:absolute;right:20px;top:16px;color:#d7aa57;opacity:.44;font-size:12px}
.message-text{
  margin:14px 0 18px;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:24px;
  line-height:1.42;
  color:#f6eef4;
}
.message-line{width:38px;height:1px;background:linear-gradient(90deg,rgba(215,170,87,.6),transparent);margin-bottom:10px}
.author{font-family:"Italianno",cursive;color:#d7aa57;font-size:27px}
.message-actions{display:flex;gap:15px;margin-top:15px;flex-wrap:wrap}
.message-action{border:0;background:transparent;color:#bfb3c0;padding:0;font-size:9px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.action-status{min-height:17px;margin-top:9px;color:#cfc3cf;font-size:10px}
.empty{grid-column:1/-1;text-align:center;color:#ddd4dd;padding:30px}
.more-wrap{display:none;text-align:center;margin-top:28px} .more-wrap.show{display:block}
.more-btn{
  border:1px solid rgba(215,170,87,.42);
  border-radius:999px;
  padding:12px 20px;
  background:rgba(215,170,87,.025);
  color:#ecd29e;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  cursor:pointer;
}

footer{
  border-top:1px solid rgba(224,183,99,.16);
  padding:48px 20px 36px;
  text-align:center;
}
.footer-logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;letter-spacing:.17em;color:#e7d3aa}
.socials{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:22px}
.socials a{color:#c5b9c6;font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.copy{margin-top:28px;color:#948797;font-size:9px;letter-spacing:.16em}

.music-toggle{
  position:fixed;right:22px;bottom:22px;z-index:999;
  display:flex;align-items:center;gap:9px;padding:10px 14px;
  border:1px solid rgba(215,170,87,.34);border-radius:999px;
  background:rgba(8,6,17,.82);color:#ead9b8;
  font-size:9px;letter-spacing:.13em;text-transform:uppercase;
}
.music-icon{width:18px;height:18px;display:grid;place-items:center;border:1px solid rgba(215,170,87,.32);border-radius:50%}

@media(max-width:760px){
  .topbar{padding:17px 5vw 10px}
  .top-logo{font-size:26px}
  .hero-image-wrap{
    width:100vw;
    margin-bottom:24px;
    overflow:hidden;
  }
  .hero-image{
    width:108vw;
    max-width:none;
    margin-left:-4vw;
  }
  .hero-hotspot{
    left:6.7%;
    top:74.5%;
    width:32.1%;
    height:9.6%;
  }
  .random-result .message{padding:30px 22px 26px}
  .random-result .message-text{font-size:28px}
  .form-wrap{width:88vw}
  .form-card{padding:26px 22px 24px}
  textarea{font-size:14px;min-height:126px}
  .submit{min-width:185px;font-size:15px}
  .grid{grid-template-columns:1fr}
  .messages{padding-bottom:68px}
  .music-toggle{right:14px;bottom:14px;font-size:8px;padding:9px 11px}
}
</style>

<body>

<audio id="orinaya-music" src="./orinaya-piano.mp3" preload="metadata" loop></audio>
<button class="music-toggle" id="music-toggle" type="button" aria-label="Pustit atmosféru" aria-pressed="false">
  <span class="music-icon">♪</span>
  <span class="music-label">Pustit atmosféru</span>
</button>

<div class="topbar">
  <a class="top-logo" href="/">ORINAYA</a>
  <a class="home-link" href="/">← Zpět domů</a>
</div>

<section class="hero-image-wrap" aria-label="Vzkazy pro Tebe">
  <img class="hero-image" src="/vzkazy-hero-full.jpg" alt="Vzkazy pro Tebe">
  <button class="hero-hotspot" id="heroRandomBtn" type="button" aria-label="Vytáhni si vzkaz"></button>
</section>

<main>

<section class="random-wrap" aria-label="Náhodný vzkaz">
  <button id="randomBtn" class="random-btn" type="button">Vytáhni si náhodný vzkaz pro sebe</button>
  <div id="randomResult" class="random-result"></div>
  <div id="randomStatus" class="action-status" aria-live="polite"></div>

<section class="form-wrap">
  <div class="form-heading">
    <h2>Zanech svůj vzkaz</h2>
    <div class="form-script">Slova, která mají sílu. Pošli kousek své energie dál.</div>
  </div>

  <div class="form-card">
    <form id="messageForm">

      <div class="input-group">
        <label for="name">Jméno / podpis (volitelné)</label>
        <input id="name" type="text" maxlength="80" placeholder="Tvé jméno nebo přezdívka">
      </div>

      <div class="input-group">
        <label for="message">Tvůj vzkaz</label>
        <textarea id="message" maxlength="500" required placeholder="Co chceš vzkázat ostatním?"></textarea>
        <div class="counter"><span id="count">0</span> / 500</div>
      </div>

      <div class="symbol-label">Můžeš přidat i malý symbol:</div>
      <div class="symbol-row">
        <button class="symbol-btn" type="button" data-symbol="♡">♡</button>
        <button class="symbol-btn" type="button" data-symbol="✦">✦</button>
        <button class="symbol-btn" type="button" data-symbol="☾">☾</button>
        <button class="symbol-btn" type="button" data-symbol="☼">☼</button>
        <button class="symbol-btn" type="button" data-symbol="❀">❀</button>
        <button class="symbol-btn" type="button" data-symbol="❦">❦</button>
        <button class="symbol-btn" type="button" data-symbol="∞">∞</button>
        <button class="symbol-btn" type="button" data-symbol="✧">✧</button>
        <button class="symbol-btn" type="button" data-symbol="❁">❁</button>
        <button class="symbol-btn" type="button" data-symbol="⋆">⋆</button>
      </div>

      <label class="check">
        <input type="checkbox" id="anonymous">
        Chci zůstat anonymní
      </label>

      <button class="submit" id="submitBtn" type="submit">Odeslat vzkaz ✦</button>

  <div id="moreWrap" class="more-wrap">

  </div>

</main>

<footer>
  <div class="footer-logo">ORINAYA</div>
  <div class="socials">
    <a href="https://www.instagram.com/orinaya.energy" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.facebook.com/share/1EFY1Sjqfv/" target="_blank" rel="noopener">Facebook</a>
  </div>
  <div class="copy">© 2026 ORINAYA</div>
</footer>

<script>

const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

const PAGE_SIZE = 12;

let loadedMessages = [];
let nextOffset = 0;
let hasMore = false;
let loadingMessages = false;

function messageCardMarkup(m,key){
  return `
    <article class="message" data-message-key="${key}">
      <div class="message-text">${esc(m.message)}</div>
      <div class="message-line"></div>
      <div class="author">${esc(m.anonymous ? "Anonymně" : (m.name || "Anonymně"))}</div>
      <div class="message-actions" aria-label="Akce vzkazu">
        <button class="message-action" type="button" data-action="save">Uložit</button>
        <button class="message-action" type="button" data-action="share">Sdílet</button>
      </div>
      <div class="action-status" aria-live="polite"></div>
    </article>
  `;
}

function renderMessages(){
  const grid = document.getElementById("grid");
  const moreWrap = document.getElementById("moreWrap");

  if(!loadedMessages.length){
    grid.innerHTML = '<div class="empty">První vzkazy teprve přijdou.</div>';
    moreWrap.classList.remove("show");
    return;
  }

  grid.innerHTML = loadedMessages.map((m,i) => messageCardMarkup(m,`loaded-${i}`)).join("");
  moreWrap.classList.toggle("show", hasMore);
}

async function loadMessages(reset = false){
  if(loadingMessages) return;

  loadingMessages = true;

  const grid = document.getElementById("grid");
  const moreBtn = document.getElementById("moreBtn");

  if(reset){
    loadedMessages = [];
    nextOffset = 0;
    grid.innerHTML = '<div class="empty">Načítám vzkazy…</div>';
  }

  moreBtn.disabled = true;
  moreBtn.textContent = "Načítám…";

  try{
    const r = await fetch(`/api/messages?limit=${PAGE_SIZE}&offset=${nextOffset}`);

    if(!r.ok) throw new Error();

    const data = await r.json();
    const newMessages = data.messages || [];

    loadedMessages = loadedMessages.concat(newMessages);
    hasMore = !!data.hasMore;
    nextOffset = data.nextOffset ?? (nextOffset + newMessages.length);

    renderMessages();

  }catch(e){
    if(!loadedMessages.length){
      grid.innerHTML = '<div class="empty">Vzkazy se teď nepodařilo načíst.</div>';
    }
  }finally{
    loadingMessages = false;
    moreBtn.disabled = false;
    moreBtn.textContent = "Načíst další vzkazy";
  }
}

document.getElementById("moreBtn").addEventListener("click", () => loadMessages(false));

const messageArea = document.getElementById("message");
const count = document.getElementById("count");

messageArea.addEventListener("input", () => {
  count.textContent = messageArea.value.length;
});

document.querySelectorAll(".symbol-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const symbol = btn.dataset.symbol;

    btn.classList.add("is-picked");
    setTimeout(() => btn.classList.remove("is-picked"), 420);

    const start = messageArea.selectionStart ?? messageArea.value.length;
    const end = messageArea.selectionEnd ?? messageArea.value.length;

    const before = messageArea.value.slice(0,start);
    const after = messageArea.value.slice(end);

    const spacer = before && !/\s$/.test(before) ? " " : "";
    const next = before + spacer + symbol + after;

    messageArea.value = next.slice(0,500);
    count.textContent = messageArea.value.length;

    const pos = Math.min(
      before.length + spacer.length + symbol.length,
      messageArea.value.length
    );

    messageArea.focus();
    messageArea.setSelectionRange(pos,pos);
  });
});

document.getElementById("anonymous").addEventListener("change", e => {
  const nameInput = document.getElementById("name");
  nameInput.disabled = e.target.checked;

  if(e.target.checked){
    nameInput.value = "";
  }
});

document.getElementById("messageForm").addEventListener("submit", async e => {
  e.preventDefault();

  const btn = document.getElementById("submitBtn");
  const st = document.getElementById("status");

  btn.disabled = true;
  st.className = "status show";
  st.textContent = "Odesílám…";

  try{
    const body = {
      message: messageArea.value.trim(),
      name: document.getElementById("name").value.trim(),
      anonymous: document.getElementById("anonymous").checked
    };

    const r = await fetch("/api/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });

    const data = await r.json().catch(() => ({}));

    if(!r.ok){
      throw new Error(data.error || "Nepodařilo se odeslat vzkaz.");
    }

    e.target.reset();
    document.getElementById("name").disabled = false;
    count.textContent = "0";

    st.className = "status show ok";
    st.textContent = "Děkuju. Tvůj vzkaz teď čeká na schválení. ♡";

  }catch(err){
    st.className = "status show err";
    st.textContent = err.message || "Nepodařilo se odeslat vzkaz.";
  }finally{
    btn.disabled = false;
  }
});


let currentRandomMessage = null;
let randomPool = null;

function messageForKey(key){
  if(key === "random") return currentRandomMessage;
  if(key && key.startsWith("loaded-")){
    const i = Number(key.slice(7));
    return loadedMessages[i] || null;
  }
  return null;
}

async function fetchAllApprovedMessages(){
  if(randomPool) return randomPool;

  const all = [];
  let offset = 0;
  let loops = 0;

  while(loops < 20){
    const r = await fetch(`/api/messages?limit=100&offset=${offset}`);
    if(!r.ok) throw new Error("Vzkazy se teď nepodařilo načíst.");

    const data = await r.json();
    const batch = data.messages || [];
    all.push(...batch);

    if(!data.hasMore || !batch.length) break;
    offset = data.nextOffset ?? (offset + batch.length);
    loops++;
  }

  randomPool = all;
  return all;
}

document.getElementById("randomBtn").addEventListener("click", async () => {
  const btn = document.getElementById("randomBtn");
  const box = document.getElementById("randomResult");
  const st = document.getElementById("randomStatus");

  btn.disabled = true;
  st.textContent = "Hledám jeden vzkaz pro tebe…";

  try{
    const pool = await fetchAllApprovedMessages();

    if(!pool.length){
      box.classList.remove("show");
      box.innerHTML = "";
      st.textContent = "Zatím tu není žádný schválený vzkaz.";
      return;
    }

    let picked = pool[Math.floor(Math.random()*pool.length)];

    if(pool.length > 1 && currentRandomMessage){
      let guard = 0;
      while(picked === currentRandomMessage && guard < 8){
        picked = pool[Math.floor(Math.random()*pool.length)];
        guard++;
      }
    }

    currentRandomMessage = picked;
    box.classList.remove("show");
    box.innerHTML = messageCardMarkup(picked,"random");
    void box.offsetWidth;
    box.classList.add("show");
    st.textContent = "";

    const afterglow = document.getElementById("randomAfterglow");
    if(afterglow){
      afterglow.classList.remove("show");
      void afterglow.offsetWidth;
      afterglow.classList.add("show");
    }

    box.scrollIntoView({behavior:"smooth",block:"center"});
  }catch(err){
    st.textContent = err.message || "Náhodný vzkaz se teď nepodařilo načíst.";
  }finally{
    btn.disabled = false;
  }
});

function splitCanvasText(ctx,text,maxWidth){
  const words = String(text || "").trim().split(/\s+/);
  const lines = [];
  let line = "";

  for(const word of words){
    const test = line ? `${line} ${word}` : word;
    if(ctx.measureText(test).width <= maxWidth){
      line = test;
    }else{
      if(line) lines.push(line);
      line = word;
    }
  }

  if(line) lines.push(line);
  return lines;
}

    const dx=48, dy=48, dw=500, dh=579;
    const targetRatio=dw/dh, srcRatio=img.naturalWidth/img.naturalHeight;
    let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
    if(srcRatio>targetRatio){
      sw=Math.round(img.naturalHeight*targetRatio);
      sx=Math.round((img.naturalWidth-sw)/2);
    } else {

      sy=Math.round((img.naturalHeight-sh)/2);

  const maxWidth=500;

    ctx.font=`400 ${fontSize}px "Cormorant Garamond", Georgia, serif`;

    lines=splitCanvasText(ctx,message.message,maxWidth);
    if(lines.length*lineHeight<=250) break;
    fontSize-=2;
  }
  ctx.fillStyle="#f5eef3";
  ctx.font=`400 ${fontSize}px "Cormorant Garamond", Georgia, serif`;
  const total=lines.length*lineHeight;
  let y=350-total/2;
  for(const line of lines){
    ctx.fillText(line,cx,y);
    y+=lineHeight;

  const author = message.anonymous ? "Anonymně" : (message.name || "Anonymně");

function downloadBlob(blob,filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url),1500);
}

async function saveMessageImage(message){
  const blob = await createMessageImage(message);
  if(!blob) throw new Error("Obrázek se nepodařilo vytvořit.");
  downloadBlob(blob,"orinaya-vzkaz-pro-tebe.png");
}

async function shareMessage(message){
  const text = `„${message.message}“\n\n${message.anonymous ? "Anonymně" : (message.name || "Anonymně")}\nORINAYA`;
  const blob = await createMessageImage(message);

  if(blob && navigator.share && navigator.canShare){
    const file = new File([blob],"orinaya-vzkaz-pro-tebe.png",{type:"image/png"});
    if(navigator.canShare({files:[file]})){
      await navigator.share({
        title:"Vzkaz pro Tebe | ORINAYA",
        text:"Vzkaz pro Tebe",
        files:[file]
      });
      return "Sdílení otevřeno.";
    }
  }

  if(navigator.share){
    await navigator.share({
      title:"Vzkaz pro Tebe | ORINAYA",
      text,
      url:window.location.href
    });
    return "Sdílení otevřeno.";
  }

  if(navigator.clipboard){
    await navigator.clipboard.writeText(`${text}\n${window.location.href}`);
    return "Vzkaz je zkopírovaný do schránky.";
  }

  if(blob){
    downloadBlob(blob,"orinaya-vzkaz-pro-tebe.png");
    return "Obrázek vzkazu byl uložen.";
  }

  throw new Error("Sdílení teď není dostupné.");
}

document.addEventListener("click", async e => {
  const actionBtn = e.target.closest(".message-action");
  if(!actionBtn) return;

  const card = actionBtn.closest(".message");
  if(!card) return;

  const message = messageForKey(card.dataset.messageKey);
  if(!message) return;

  const status = card.querySelector(".action-status");
  const action = actionBtn.dataset.action;

  actionBtn.disabled = true;
  if(status) status.textContent = action === "save" ? "Připravuju obrázek…" : "Připravuju sdílení…";

  try{
    if(action === "save"){
      await saveMessageImage(message);
      if(status) status.textContent = "Vzkaz uložen. ♡";
    }else{
      const result = await shareMessage(message);
      if(status) status.textContent = result;
    }
  }catch(err){
    if(err && err.name === "AbortError"){
      if(status) status.textContent = "";
    }else{
      if(status) status.textContent = err.message || "Teď se to nepodařilo.";
    }
  }finally{
    actionBtn.disabled = false;
    setTimeout(() => {
      if(status) status.textContent = "";
    },3500);
  }
});


loadMessages(true);

</script>

<script>

(function(){
  const audio = document.getElementById('orinaya-music');
  const button = document.getElementById('music-toggle');
  if (!audio || !button) return;

  const label = button.querySelector('.music-label');
  const KEY = 'orinayaMusicStateV1';
  audio.volume = 0.18;

  function readState(){
    try{
      return JSON.parse(localStorage.getItem(KEY) || '{}');
    }catch(e){
      return {};
    }
  }

  function saveState(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        playing: !audio.paused,
        time: Number.isFinite(audio.currentTime) ? audio.currentTime : 0,
        updated: Date.now()
      }));
    }catch(e){}
  }

  function setButton(playing, wantsResume){
    button.classList.toggle('is-playing', playing);
    button.setAttribute('aria-pressed', playing ? 'true' : 'false');

    if (playing){
      button.setAttribute('aria-label','Ztišit atmosféru');
      if (label) label.textContent = 'Ztišit atmosféru';
    }else if (wantsResume){
      button.setAttribute('aria-label','Pokračovat v atmosféře');
      if (label) label.textContent = 'Pokračovat v atmosféře';
    }else{
      button.setAttribute('aria-label','Pustit atmosféru');
      if (label) label.textContent = 'Pustit atmosféru';
    }
  }

  const state = readState();
  let wantsResume = !!state.playing;

  audio.addEventListener('loadedmetadata', async function(){
    if (Number.isFinite(state.time) && state.time > 0 && audio.duration){
      audio.currentTime = state.time % audio.duration;
    }

    if (wantsResume){
      try{
        await audio.play();
        setButton(true, false);
      }catch(e){
        setButton(false, true);
      }
    }else{
      setButton(false, false);
    }
  }, {once:true});

  button.addEventListener('click', async function(){
    if (audio.paused){
      try{
        await audio.play();
        wantsResume = true;
        setButton(true, false);
        saveState();
      }catch(e){
        setButton(false, true);
      }
    }else{
      audio.pause();
      wantsResume = false;
      setButton(false, false);
      saveState();
    }
  });

  audio.addEventListener('play', function(){
    wantsResume = true;
    setButton(true, false);
    saveState();
  });

  audio.addEventListener('pause', function(){
    setButton(false, wantsResume);
    saveState();
  });

  let lastSave = 0;
  audio.addEventListener('timeupdate', function(){
    const now = Date.now();
    if (now - lastSave > 1000){
      lastSave = now;
      saveState();
    }
  });

  document.addEventListener('click', function(e){
    const a = e.target.closest('a[href]');
    if (a) saveState();
  }, true);

  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);
})();

</script>
