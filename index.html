    <!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080611">
<title>ORINAYA</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#080611}
  body{overflow-x:hidden}

  .hero{
    position:relative;
    width:100%;
    height:100svh;
    min-height:560px;
    background:#080611 url("./hero.png") center center / cover no-repeat;
    overflow:hidden;
    isolation:isolate;
  }

  .fx{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }

  .parallax{
    position:absolute;
    inset:-2%;
    pointer-events:none;
    z-index:1;
    transition:transform .2s ease-out;
    will-change:transform;
  }

  .wave-glow{
    position:absolute;
    left:-18%;
    right:-18%;
    bottom:11%;
    height:34%;
    opacity:.18;
    filter:blur(12px);
    background:
      radial-gradient(ellipse at 16% 48%, rgba(255,219,132,.26) 0 2%, transparent 12%),
      radial-gradient(ellipse at 35% 56%, rgba(229,179,83,.16) 0 3%, transparent 13%),
      radial-gradient(ellipse at 54% 48%, rgba(255,231,166,.22) 0 2%, transparent 13%),
      radial-gradient(ellipse at 74% 42%, rgba(230,176,78,.14) 0 2%, transparent 12%),
      radial-gradient(ellipse at 88% 32%, rgba(255,226,151,.18) 0 2%, transparent 12%);
    animation:waveDrift 12s ease-in-out infinite alternate;
    transform:translate3d(0,0,0);
  }

  @keyframes waveDrift{
    from{transform:translate3d(-1.2%,.4%,0) scale(1)}
    to{transform:translate3d(1.4%,-.4%,0) scale(1.025)}
  }

  .wave-path-wrap{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    mix-blend-mode:screen;
  }

  .wave-svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }

  .wave-base{
    fill:none;
    stroke:rgba(248,204,121,.10);
    stroke-width:3;
    stroke-linecap:round;
    filter:drop-shadow(0 0 4px rgba(242,186,84,.16));
  }

  .wave-flow{
    fill:none;
    stroke:url(#flowGradient);
    stroke-width:5.2;
    stroke-linecap:round;
    stroke-dasharray:190 1700;
    animation:flowAlong 8.5s linear infinite;
    filter:
      drop-shadow(0 0 8px rgba(255,224,142,.70))
      drop-shadow(0 0 20px rgba(240,182,72,.42));
    opacity:.95;
  }

  .wave-flow-2{
    fill:none;
    stroke:url(#flowGradientSoft);
    stroke-width:3.2;
    stroke-linecap:round;
    stroke-dasharray:110 1900;
    animation:flowAlong2 12.5s linear infinite;
    filter:
      drop-shadow(0 0 6px rgba(255,220,135,.42))
      drop-shadow(0 0 16px rgba(227,168,63,.24));
    opacity:.55;
  }

  @keyframes flowAlong{
    from{stroke-dashoffset:0}
    to{stroke-dashoffset:-1890}
  }

  @keyframes flowAlong2{
    from{stroke-dashoffset:560}
    to{stroke-dashoffset:-1450}
  }

  .travel-dot{
    fill:#ffe7ad;
    opacity:.96;
    filter:
      drop-shadow(0 0 8px rgba(255,235,173,.95))
      drop-shadow(0 0 18px rgba(240,183,72,.75));
  }

  .travel-dot-soft{
    fill:#ffd789;
    opacity:.55;
    filter:
      drop-shadow(0 0 6px rgba(255,228,159,.6))
      drop-shadow(0 0 14px rgba(230,168,52,.45));
  }

  .breath{
    position:absolute;
    left:50%;
    top:15.6%;
    width:6.2vw;
    height:6.2vw;
    min-width:34px;
    min-height:34px;
    max-width:88px;
    max-height:88px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(
      circle,
      rgba(255,242,201,.33) 0 8%,
      rgba(229,194,111,.15) 22%,
      rgba(183,146,78,.06) 46%,
      transparent 70%
    );
    filter:blur(2px);
    opacity:.46;
    animation:breathe 6.8s ease-in-out infinite;
  }

  @keyframes breathe{
    0%,100%{
      transform:translate(-50%,-50%) scale(.9);
      opacity:.26
    }
    50%{
      transform:translate(-50%,-50%) scale(1.15);
      opacity:.6
    }
  }

  .spark{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#ffe4a2;
    box-shadow:
      0 0 7px rgba(255,225,152,.95),
      0 0 16px rgba(222,171,75,.48);
    opacity:.25;
    animation:floatSpark var(--dur,8s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }

  @keyframes floatSpark{
    0%,100%{
      transform:translate3d(0,3px,0) scale(.7);
      opacity:.15
    }
    35%{opacity:.62}
    50%{
      transform:translate3d(var(--dx,8px),-8px,0) scale(1.12);
      opacity:.78
    }
    70%{opacity:.34}
  }

  .sp1{left:18%;top:39%;--dur:8.5s;--delay:.8s;--dx:7px}
  .sp2{left:31%;top:61%;--dur:10.2s;--delay:2.2s;--dx:-6px}
  .sp3{left:47%;top:35%;--dur:9.4s;--delay:1.4s;--dx:9px}
  .sp4{left:63%;top:58%;--dur:11s;--delay:3.1s;--dx:-8px}
  .sp5{left:78%;top:31%;--dur:9s;--delay:.2s;--dx:6px}
  .sp6{left:86%;top:53%;--dur:10.8s;--delay:2.7s;--dx:-7px}

  .hit{
    position:absolute;
    display:block;
    z-index:3;
    background:transparent;
    border:0;
  }

  .blog{
    left:83.3%;
    top:6.4%;
    width:7.6%;
    height:5.2%
  }

  .about{
    left:90.2%;
    top:6.4%;
    width:6.5%;
    height:5.2%
  }

  .btn-blog{
    left:28.7%;
    top:57.1%;
    width:20.6%;
    height:6.8%
  }

  .btn-story{
    left:50.7%;
    top:57.1%;
    width:21.1%;
    height:6.8%
  }

  .instagram{
    left:2.7%;
    bottom:5.7%;
    width:10.8%;
    height:5%
  }

  .facebook{
    left:13.4%;
    bottom:5.7%;
    width:10.6%;
    height:5%
  }

  .contact{
    left:23.3%;
    bottom:5.7%;
    width:10.2%;
    height:5%
  }

  @media (max-aspect-ratio: 3/4){
    .hero{
      height:auto;
      min-height:0;
      aspect-ratio:3/2;
      background-size:contain;
      background-position:center top;
      background-repeat:no-repeat;
    }

    .breath{
      top:15.6%;
      width:11vw;
      height:11vw;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .wave-glow,
    .wave-flow,
    .wave-flow-2,
    .breath,
    .spark{
      animation:none!important;
    }

    .parallax{
      transform:none!important;
    }
  }
</style>
</head>

<body>

<section class="hero" aria-label="ORINAYA">

  <div class="fx" aria-hidden="true">
    <div class="parallax" id="parallax">

      <div class="wave-glow"></div>

      <div class="wave-path-wrap">
        <svg class="wave-svg" viewBox="0 0 1500 1000" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(255,221,145,0)"/>
              <stop offset="20%" stop-color="rgba(255,231,178,.15)"/>
              <stop offset="50%" stop-color="rgba(255,236,186,1)"/>
              <stop offset="80%" stop-color="rgba(240,189,86,.35)"/>
              <stop offset="100%" stop-color="rgba(255,221,145,0)"/>
            </linearGradient>

            <linearGradient id="flowGradientSoft" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(255,221,145,0)"/>
              <stop offset="50%" stop-color="rgba(255,221,145,.55)"/>
              <stop offset="100%" stop-color="rgba(255,221,145,0)"/>
            </linearGradient>

            <path id="wavePath" d="M -60 690
              C 90 620, 240 760, 410 710
              C 560 668, 675 700, 760 790
              C 850 690, 995 662, 1115 705
              C 1280 765, 1420 650, 1560 610" />
          </defs>

          <use href="#wavePath" class="wave-base"></use>
          <use href="#wavePath" class="wave-flow"></use>
          <use href="#wavePath" class="wave-flow-2"></use>

          <circle class="travel-dot" r="4.8">
            <animateMotion dur="8.5s" repeatCount="indefinite" rotate="auto">
              <mpath href="#wavePath"/>
            </animateMotion>
          </circle>

          <circle class="travel-dot-soft" r="2.8">
            <animateMotion dur="12.5s" begin="1.8s" repeatCount="indefinite" rotate="auto">
              <mpath href="#wavePath"/>
            </animateMotion>
          </circle>
        </svg>
      </div>

      <div class="breath"></div>

      <span class="spark sp1"></span>
      <span class="spark sp2"></span>
      <span class="spark sp3"></span>
      <span class="spark sp4"></span>
      <span class="spark sp5"></span>
      <span class="spark sp6"></span>

    </div>
  </div>

  <a
    class="hit blog"
    href="https://www.orinaya.blog/"
    target="_blank"
    rel="noopener"
    aria-label="Blog">
  </a>

  <a
    class="hit about"
    href="#omne"
    aria-label="O mně">
  </a>

  <a
    class="hit btn-blog"
    href="https://www.orinaya.blog/"
    target="_blank"
    rel="noopener"
    aria-label="Začíst se do blogu">
  </a>

  <a
    class="hit btn-story"
    href="#omne"
    aria-label="Poznat můj příběh">
  </a>

  <a
    class="hit instagram"
    href="#"
    aria-label="Instagram">
  </a>

  <a
    class="hit facebook"
    href="#"
    aria-label="Facebook">
  </a>

  <a
    class="hit contact"
    href="#"
    aria-label="Kontakt">
  </a>

</section>

<section id="omne" style="min-height:1px;background:#080611"></section>

<script>
(() => {
  const p = document.getElementById('parallax');

  if (
    !p ||
    window.matchMedia('(prefers-reduced-motion: reduce)').matches
  ) return;

  let ticking = false;

  const update = () => {
    const y = Math.min(window.scrollY, 280);
    p.style.transform = `translate3d(0, ${y * 0.035}px, 0)`;
    ticking = false;
  };

  addEventListener(
    'scroll',
    () => {
      if (!ticking) {
        requestAnimationFrame(update);
        ticking = true;
      }
    },
    {passive:true}
  );
})();
</script>

</body>
</html>
